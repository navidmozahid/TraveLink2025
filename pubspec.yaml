name: travelink
description: "A travel social media and booking application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_stripe: ^12.3.0

  # 🔹 Supabase
  supabase_flutter: ^2.10.1

  file_picker: ^8.0.0


  # 🔹 Media & uploads
  image_picker: ^1.0.7
  uuid: ^4.3.3
  video_player: ^2.8.6

  # 🔹 Explore Map
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  http: ^1.2.1
  flutter_polyline_points: ^2.0.0



  # 🔹 REQUIRED for Instagram-style video autoplay
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/travelink.png"


flutter:
  uses-material-design: true

  assets:
    - assets/